  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squero-actuator-resize
subjects:
- kind: ServiceAccount
  name: squero-actuator
  namespace: squero-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-actuator-self
  namespace: squero-actuator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squero-actuator-self
subjects:
- kind: ServiceAccount
  name: squero-actuator
  namespace: squero-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-actuator-state
  namespace: squero-actuator
