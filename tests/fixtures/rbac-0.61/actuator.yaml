  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squero-actuator-nodes
subjects:
- kind: ServiceAccount
  name: squero-actuator
  namespace: squero-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: squero-actuator-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squero-actuator-webhook
subjects:
- kind: ServiceAccount
  name: squero-actuator
  namespace: squero-actuator
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: squero-actuator
  name: squero-actuator
  namespace: squero-actuator
spec:
  ports:
  - name: webhook
    port: 443
    targetPort: webhook
  selector:
    app: squero-actuator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: squero-actuator
  name: squero-actuator
  namespace: squero-actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: squero-actuator
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: tmp
      labels:
        app: squero-actuator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - actuator
        env:
        - name: HOME
          value: /tmp
        - name: SQUERO_ACTUATOR_HUB
          value: https://hub.example.com
        - name: SQUERO_ACTUATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SQUERO_ACTUATOR_POD
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - secretRef:
            name: squero-actuator
        image: ghcr.io/alexboscolo954/squero:0.61.0
        name: actuator
        ports:
        - containerPort: 8443
          name: webhook
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: squero-actuator
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: squero-actuator
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: squero-actuator
      namespace: squero-actuator
      path: /mutate
  failurePolicy: Ignore
  name: pods.squero-actuator.io
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - demo
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: 2
