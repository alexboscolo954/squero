name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # make test takes ~4; a hang fails here instead of running on
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: .github/install-sops.sh
      - uses: azure/setup-helm@v4   # the tests render the chart (Phase 18.1a)
        with:
          version: v3.17.3
      - run: make lint
      - run: make test

  console:
    # The console app (console/): API types in sync with the Hub, typecheck, lint,
    # tests and the build, in the same pinned Node the image builds with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: make console-check

  integration:
    # Real MCP tools + a scripted agent run against broken workloads on kind.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: .github/install-sops.sh
      - uses: azure/setup-helm@v4   # actuator-smoke installs the chart (Phase 18.1a)
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1
        with:
          cluster_name: squero
          config: demo/kind.yaml
      - run: make demo
      - run: make integration
        env:
          SQUERO_RECORD_DIR: recordings
      - run: make deploy-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recordings
          path: recordings/
          if-no-files-found: ignore
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n squero logs deploy/squero --tail=100 || true
          kubectl -n squero-relay logs deploy/squero-relay --tail=50 || true

  hub-smoke:
    # The Hub's compose stack (deploy/hub): health, the public boundary through
    # Caddy, backups that restore, and a bad contracts update that never restarts it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make hub-smoke

  publish:
    # On tags only: the image (ghcr.io/alexboscolo954/squero:<version>) with its SBOM and
    # provenance, and the chart (oci://ghcr.io/alexboscolo954/charts/squero), both signed
    # with cosign keyless (Phase 18.1c) and verified with the command client-cluster.md shows.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, console, integration, hub-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless: GitHub's OIDC identity, here only
    env:
      IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yaml@refs/tags/v
      ISSUER: https://token.actions.githubusercontent.com
    # Its actions pinned to commits (it signs as the release); .github/dependabot.yml bumps them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # Before anything is pushed: the chart is the tag's version and packages.
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          grep -qx "version: $v" charts/squero/Chart.yaml
          grep -qx "appVersion: \"$v\"" charts/squero/Chart.yaml
          helm package charts/squero
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0, arm64 build on an amd64 runner
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
          # GitHub doesn't recognise PolyForm, so its license would read NOASSERTION.
          labels: org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max   # its build args are versions only (Dockerfile)
      - env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" >/dev/null
          for part in SBOM Provenance; do   # as client-cluster.md reads them
            j=$(docker buildx imagetools inspect "$IMAGE" --format "{{json .$part}}")
            [[ -n $j && $j != null && $j != '{}' ]] || { echo "no $part"; exit 1; }
          done
      - env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CHARTS: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "squero-${TAG#v}.tgz" "oci://$CHARTS" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          digest=$(awk '/^Digest:/ {print $2}' <<<"$out")   # helm prints it on stderr
          [[ $digest == sha256:* ]] || { echo "helm push gave no digest"; exit 1; }
          cosign sign --yes "$CHARTS/squero@$digest"
          cosign verify "$CHARTS/squero@$digest" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" >/dev/null
